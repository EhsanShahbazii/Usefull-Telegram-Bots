name: 🔍 Auto-Discover & Verify Bots

on:
  schedule:
    # Runs every 3 days at 00:00 UTC
    - cron: '0 0 */3 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  discover-and-verify:
    name: Crawl, Verify & Update Bots
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🔍 Discover New Active Bots
        run: |
          python3 scripts/discover_bots.py --limit 10 --auto-merge

      - name: 🧪 Verify Liveness of Catalog
        run: |
          python3 scripts/check_bots.py --json data/bots.json --report BOT_HEALTH.md

      - name: 🚀 Commit & Push Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/bots.json README.md BOT_HEALTH.md DISCOVERED_BOTS.md
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore(auto-update): add newly discovered verified bots and update health report [skip ci]"
            git push origin main
          else
            echo "No changes to commit. Catalog is already up to date."
          fi
